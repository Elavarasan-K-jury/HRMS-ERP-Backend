syntax = "proto3";

package notice_period_policy;

// ─────────────────────────────────────────────────────────────────────────────
//  Notice Period Policy Service – CRUD (Exit Settings → Notice Period)
// ─────────────────────────────────────────────────────────────────────────────
service NoticePeriodPolicyService {
  rpc CreatePolicy (CreatePolicyRequest) returns (PolicyResponse);
  rpc GetPolicy    (GetPolicyRequest)    returns (PolicyResponse);
  rpc ListPolicies (ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc UpdatePolicy (UpdatePolicyRequest) returns (PolicyResponse);
  rpc DeletePolicy (DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc SetDefaultPolicy (SetDefaultPolicyRequest) returns (PolicyResponse);
  
  // Employee assignment
  rpc GetPolicyEmployees (GetPolicyEmployeesRequest) returns (GetPolicyEmployeesResponse);
  rpc AssignEmployees (AssignEmployeesRequest) returns (AssignEmployeesResponse);
  rpc RemoveEmployee (RemoveEmployeeRequest) returns (RemoveEmployeeResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Request Messages
// ─────────────────────────────────────────────────────────────────────────────
message CreatePolicyRequest {
  string organization_id = 1;
  string title           = 2;
  string description     = 3;
  int32  duration_value  = 4;
  string duration_unit   = 5;
  bool   is_default      = 6;
}

message GetPolicyRequest {
  string id              = 1;
  string organization_id = 2;
}

message UpdatePolicyRequest {
  string id              = 1;
  string organization_id = 2;
  string title           = 3;
  string description     = 4;
  int32  duration_value  = 5;
  string duration_unit   = 6;
  bool   is_default      = 7;
}

message DeletePolicyRequest {
  string id              = 1;
  string organization_id = 2;
}

message ListPoliciesRequest {
  string organization_id = 1;
  int32  page            = 2;
  int32  limit           = 3;
  string search          = 4;
  string sort_by         = 5;
  string sort_order      = 6;
}

message SetDefaultPolicyRequest {
  string id              = 1;
  string organization_id = 2;
  bool   is_default      = 3;
}

message GetPolicyEmployeesRequest {
  string id              = 1;
  string organization_id = 2;
  int32  page            = 3;
  int32  limit           = 4;
  string search          = 5;
}

message AssignEmployeesRequest {
  string   policy_id            = 1;
  string   organization_id      = 2;
  repeated string employee_ids  = 3;
}

message RemoveEmployeeRequest {
  string policy_id       = 1;
  string organization_id = 2;
  string employee_id     = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Response Messages
// ─────────────────────────────────────────────────────────────────────────────
message NoticePeriodPolicy {
  string id              = 1;
  string organization_id = 2;
  string title           = 3;
  string description     = 4;
  int32  duration_value  = 5;
  string duration_unit   = 6;
  bool   is_default      = 7;
  string status          = 8;
  string created_at      = 9;
  string updated_at      = 10;
  int32  employee_count  = 11;
}

message PolicyResponse {
  NoticePeriodPolicy policy = 1;
  string message      = 2;
  bool   success      = 3;
}

message ListPoliciesResponse {
  repeated NoticePeriodPolicy policies = 1;
  int32 total                 = 2;
  int32 page                  = 3;
  int32 limit                 = 4;
  int32 total_pages           = 5;
  bool success                = 6;
  string message              = 7;
}

message DeletePolicyResponse {
  bool   success = 1;
  string message = 2;
}

message SetDefaultPolicyResponse {
  bool   success = 1;
  string message = 2;
}

message PolicyEmployeesResponse {
  repeated EmployeeLite employees = 1;
  int32 total = 2;
  int32 page  = 3;
  int32 limit = 4;
  int32 total_pages = 5;
}

message EmployeeLite {
  string id              = 1;
  string employee_code   = 2;
  string full_name       = 3;
  string email           = 4;
  string designation     = 5;
  string department      = 6;
  string sub_department  = 7;
}

message GetPolicyEmployeesResponse {
  repeated EmployeeLite employees = 1;
  int32 total                 = 2;
  int32 page                  = 3;
  int32 limit                 = 4;
  int32 total_pages           = 5;
  bool success                = 6;
  string message              = 7;
}

message AssignEmployeesResponse {
  int32 assigned_count = 1;
  bool   success      = 2;
  string message      = 3;
}

message RemoveEmployeeResponse {
  bool   success = 1;
  string message = 2;
}
