syntax = "proto3";

package organization;

service OrganizationService {
  rpc CreateOrganization (CreateOrganizationRequest) returns (OrganizationResponse);
  rpc GetOrganization    (GetOrganizationRequest)    returns (OrganizationResponse);
  rpc ListOrganizations  (ListOrganizationsRequest)  returns (ListOrganizationsResponse);
  rpc UpdateOrganization (UpdateOrganizationRequest) returns (OrganizationResponse);
  rpc DeleteOrganization (DeleteOrganizationRequest) returns (DeleteOrganizationResponse);
}

// =============================
// 🔹 Create
// =============================
message CreateOrganizationRequest {
  string name = 1;
  string domain = 2;
  string gst_number = 3;
  string email = 4;
  string contact_person_name = 5;
  string contact_person_number = 6;
  string note = 7;
  string industry = 8;
  int32  size = 9;
  string address = 10; // store JSON as stringified JSON
}

// =============================
// 🔹 Get by ID
// =============================
message GetOrganizationRequest {
  string id = 1;
}

// =============================
// 🔹 Organization Object
// =============================
message Organization {
  string id = 1;
  string name = 2;
  string domain = 3;
  string gst_number = 4;
  string email = 5;
  string contact_person_name = 6;
  string contact_person_number = 7;
  string note = 8;
  string industry = 9;
  int32  size = 10;
  string address = 11;
  string created_at = 12;
  string updated_at = 13;
  string deleted_at = 14; // new field for soft deletion
}

// =============================
// 🔹 Response Wrapper
// =============================
message OrganizationResponse {
  Organization organization = 1;
}

// =============================
// 🔹 List (Pagination + Search)
// =============================
message ListOrganizationsRequest {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
  string sort_by = 4;
  string sort_order = 5;
}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
}

// =============================
// 🔹 Update
// =============================
message UpdateOrganizationRequest {
  string id = 1;
  string name = 2;
  string domain = 3;
  string gst_number = 4;
  string email = 5;
  string contact_person_name = 6;
  string contact_person_number = 7;
  string note = 8;
  string industry = 9;
  int32  size = 10;
  string address = 11;
}

// =============================
// 🔹 Delete (Soft Delete)
// =============================
message DeleteOrganizationRequest {
  string id = 1;
}

message DeleteOrganizationResponse {
  string message = 1;
}
