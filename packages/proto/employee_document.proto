syntax = "proto3";

package employee_document;

service EmployeeDocumentService {
  rpc CreateFolder (CreateFolderRequest) returns (FolderResponse);
  rpc ListFolders (ListFoldersRequest) returns (ListFoldersResponse);
  rpc GetFolder (GetFolderRequest) returns (FolderResponse);
  rpc UpdateFolder (UpdateFolderRequest) returns (FolderResponse);
  rpc DeleteFolder (DeleteFolderRequest) returns (DeleteFolderResponse);

  rpc CreateDocumentType (CreateDocumentTypeRequest) returns (DocumentTypeResponse);
  rpc ListDocumentTypes (ListDocumentTypesRequest) returns (ListDocumentTypesResponse);
  rpc GetDocumentType (GetDocumentTypeRequest) returns (DocumentTypeResponse);
  rpc UpdateDocumentType (UpdateDocumentTypeRequest) returns (DocumentTypeResponse);
  rpc DeleteDocumentType (DeleteDocumentTypeRequest) returns (DeleteDocumentTypeResponse);

  rpc CreateDocumentField (CreateDocumentFieldRequest) returns (DocumentFieldResponse);
  rpc ListDocumentFields (ListDocumentFieldsRequest) returns (ListDocumentFieldsResponse);
  rpc GetDocumentField (GetDocumentFieldRequest) returns (DocumentFieldResponse);
  rpc UpdateDocumentField (UpdateDocumentFieldRequest) returns (DocumentFieldResponse);
  rpc DeleteDocumentField (DeleteDocumentFieldRequest) returns (DeleteDocumentFieldResponse);

  rpc AssignDocument (AssignDocumentRequest) returns (AssignmentResponse);
  rpc AssignDocuments (AssignDocumentsRequest) returns (AssignDocumentsResponse);
  rpc BulkAssignDocuments (BulkAssignDocumentsRequest) returns (BulkAssignDocumentsResponse);
  rpc ListEmployeeAssignments (ListEmployeeAssignmentsRequest) returns (ListEmployeeAssignmentsResponse);
  rpc ListDocumentAssignments (ListDocumentAssignmentsRequest) returns (ListDocumentAssignmentsResponse);
  rpc GetAssignment (GetAssignmentRequest) returns (AssignmentResponse);
  rpc ListGroupedAssignments (ListGroupedAssignmentsRequest) returns (ListGroupedAssignmentsResponse);
  rpc UnassignDocument (UnassignDocumentRequest) returns (UnassignDocumentResponse);
  rpc ListPendingEmployeeDocuments (ListPendingEmployeeDocumentsRequest) returns (ListPendingEmployeeDocumentsResponse);

  rpc SubmitDocument (SubmitDocumentRequest) returns (SubmissionResponse);
  rpc GetSubmission (GetSubmissionRequest) returns (SubmissionResponse);
  rpc ListEmployeeSubmissions (ListEmployeeSubmissionsRequest) returns (ListEmployeeSubmissionsResponse);
  rpc ListAssignmentSubmissions (ListAssignmentSubmissionsRequest) returns (ListAssignmentSubmissionsResponse);
  rpc DeleteSubmission (DeleteSubmissionRequest) returns (DeleteSubmissionResponse);

  rpc ListPendingVerificationDocuments (ListPendingVerificationDocumentsRequest) returns (ListPendingVerificationDocumentsResponse);
  rpc VerifySubmission (VerifySubmissionRequest) returns (SubmissionResponse);
  rpc RejectSubmission (RejectSubmissionRequest) returns (SubmissionResponse);
  rpc ListVerifiedDocuments (ListVerifiedDocumentsRequest) returns (ListVerifiedDocumentsResponse);
  rpc ListExpiringDocuments (ListExpiringDocumentsRequest) returns (ListExpiringDocumentsResponse);
  rpc RenewDocument (RenewDocumentRequest) returns (SubmissionResponse);
}

message DocumentField {
  string id = 1;
  string document_type_id = 2;
  string label = 3;
  string key = 4;
  string field_type = 5; // TEXTBOX | NUMBER | DATE | TEXTAREA | DROPDOWN | FILE
  string options = 6;    // JSON string
  bool is_mandatory = 7;
  int32 display_order = 8;
  string created_at = 9;
  string updated_at = 10;
}

message EmployeeDocumentType {
  string id = 1;
  string folder_id = 2;
  string name = 3;
  string description = 4;
  bool is_multiple = 5;
  bool is_mandatory = 6;
  bool is_appliable_na = 7;
  bool is_file_upload_enabled = 8;
  bool is_verification_required = 9;
  bool ask_expiry_date = 10;
  int32 expiry_days = 11;
  string expiry_period = 12; // DAY | WEEK | MONTH | YEAR
  bool all_countries = 13;
  repeated string allowed_countries = 14;
  int32 display_order = 15;
  bool is_active = 16;
  string created_by_id = 17;
  string updated_by_id = 18;
  string created_at = 19;
  string updated_at = 20;
  int32 field_count = 21;
  int32 assignment_count = 22;
  repeated DocumentField fields = 23;
}

message EmployeeDocumentFolder {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string description = 4;
  bool is_confidential = 5;
  bool is_active = 6;
  string permissions = 7; // JSON string
  string created_by_id = 8;
  string updated_by_id = 9;
  string created_at = 10;
  string updated_at = 11;
  int32 document_type_count = 12;
}

