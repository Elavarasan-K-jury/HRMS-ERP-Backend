syntax = "proto3";

package attendance;

service AttendanceService {
  // Punch
  rpc CheckIn (CheckInRequest) returns (AttendanceResponse);
  rpc CheckOut (CheckOutRequest) returns (AttendanceResponse);

  // Manual Attendance
  rpc CreateAttendance (CreateAttendanceRequest) returns (AttendanceResponse);

  // Recompute attendance for a specific day
  rpc RecomputeAttendance (RecomputeRequest) returns (AttendanceResponse);

  // List attendance for a month (like Keka calendar)
  rpc ListAttendance (ListAttendanceRequest) returns (ListAttendanceResponse);
  rpc ListOrganizationAttendanceByMonth(MonthlyOrgAttendanceRequest) returns (MonthlyOrgAttendanceResponse);

  rpc AttendanceReport (AttendanceReportRequest) returns (AttendanceReportInitResponse);
  rpc GetAttendanceReportResult (GetAttendanceReportResultRequest) returns (GetAttendanceReportResultResponse);

  rpc ListAttendanceReports (ListAttendanceReportsRequest) returns (ListAttendanceReportsResponse);
  // Attendance Policies
  rpc CreateAttendancePolicy (AttendancePolicyRequest) returns (AttendancePolicyResponse);
  rpc UpdateAttendancePolicy (UpdateAttendancePolicyRequest) returns (AttendancePolicyResponse);
  rpc ListAttendancePolicy (ListAttendancePolicyRequest) returns (ListAttendancePolicyResponse);

  // Network Policies (IP restriction)
  rpc CreateNetworkPolicy (NetworkPolicyRequest) returns (NetworkPolicyResponse);
  rpc UpdateNetworkPolicy (UpdateNetworkPolicyRequest) returns (NetworkPolicyResponse);
  rpc ListNetworkPolicy (ListNetworkPolicyRequest) returns (ListNetworkPolicyResponse);

  // Geo Fences (Location restriction)
  rpc CreateGeoFence (GeoFenceRequest) returns (GeoFenceResponse);
  rpc UpdateGeoFence (UpdateGeoFenceRequest) returns (GeoFenceResponse);
  rpc ListGeoFence (ListGeoFenceRequest) returns (ListGeoFenceResponse);
}

/* ============================================================
   CHECK-IN / CHECK-OUT
============================================================ */

message CheckInRequest {
  string employee_id = 1;
  string ip_address = 2;
  double latitude = 3;
  double longitude = 4;
  string source = 5; // MOBILE | WEB | BIOMETRIC
}

message CheckOutRequest {
  string employee_id = 1;
  string ip_address = 2;
  double latitude = 3;
  double longitude = 4;
  string source = 5;
}

message CreateAttendanceRequest {
  string organization_id = 1;
  string employee_id = 2;
  string date = 3; // "2025-11-19"
  string check_in = 4;
  string check_out = 5;
  Location location = 6;
  double gross_hours = 7;
  double effective_hours = 8;
  int32 late_arrival_minutes = 9;
  string status = 10; // PRESENT | ABSENT | HALF_DAY | HOLIDAY | LATE | PENDING
  bool is_holiday = 11;
  string notes = 12;
  string mode = 13; // OFFICE | REMOTE | HYBRID
}

message Location {
  double latitude = 1;
  double longitude = 2;
}

message RecomputeRequest {
  string employee_id = 1;
  string date = 2; // "2025-11-19"
}

/* ============================================================
   ATTENDANCE OBJECT
============================================================ */
message EmployeeObject {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
}
message AttendanceObject {
  string id = 1;
  string organization_id = 2;
  string employee_id = 3;
  string date = 4;
  string check_in = 5;
  string check_out = 6;

  double gross_hours = 7;
  double effective_hours = 8;

  int32 late_arrival_minutes = 9;
  string status = 10; // PRESENT | ABSENT | HALF_DAY | HOLIDAY | LATE | PENDING
}
message AttendanceListItem {
  string id = 1;
  string organization_id = 2;
  string employee_id = 3;
  string date = 4;
  string check_in = 5;
  string check_out = 6;

  double gross_hours = 7;
  double effective_hours = 8;

  int32 late_arrival_minutes = 9;
  string status = 10; // PRESENT | ABSENT | HALF_DAY | HOLIDAY | LATE | PENDING

  repeated AttendanceLogs logs = 11;

  Employee employee = 12;
  Organization organization = 13;
}

message Employee {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
}

message Organization {
  string id = 1;
  string name = 2;
  string domain = 3;
  string email = 4;
  string contact_person_name = 5;
  string contact_person_number = 6;
  string industry = 7;
}

message geoFence {
  double latitude = 1;
  double longitude = 2;
}

message AttendanceLogs {
  string id = 1;
  string attendanceId = 2;
  string type = 3;
  string ipAddress = 4;
  geoFence geoLocation = 5;
  string source = 6;
  string createdAt = 7;
  string updatedAt = 8;
  string deletedAt = 9;
}

message AttendanceResponse {
  AttendanceObject attendance = 1;
  string message = 2;
  bool success = 3;
}

message ListAttendanceRequest {
  string employee_id = 1;
  string month = 2; // "2025-11" (YYYY-MM)
}

message ListAttendanceResponse {
  repeated AttendanceListItem attendance = 1;
  string message = 2;
  bool success = 3;
}

/* ============================================================
   ATTENDANCE POLICY CRUD
============================================================ */

message AttendancePolicyRequest {
  string organization_id = 1;
  string name = 2;
  int32 grace_minutes = 3;
  int32 half_day_minutes = 4;
  int32 full_day_minutes = 5;
  bool allow_geo_checkin = 6;
  bool allow_outside_geo = 7;
  bool auto_mark_absent = 8;
  int32 checkin_buffer_min = 9;
  int32 checkout_buffer_min = 10;
  string rounding_strategy = 11;
  bool overtime_allowed = 12;
  int32 min_overtime_minutes = 13;
}

message UpdateAttendancePolicyRequest {
  string policy_id = 1;
  AttendancePolicyRequest data = 2;
}

message AttendancePolicy {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  int32 grace_minutes = 4;
  int32 half_day_minutes = 5;
  int32 full_day_minutes = 6;
  bool allow_geo_checkin = 7;
  bool allow_outside_geo = 8;
  bool auto_mark_absent = 9;
  int32 checkin_buffer_min = 10;
  int32 checkout_buffer_min = 11;
  string rounding_strategy = 12;
  bool overtime_allowed = 13;
  int32 min_overtime_minutes = 14;
}

message AttendancePolicyResponse {
  AttendancePolicy policy = 1;
  string message = 2;
  bool success = 3;
}

message ListAttendancePolicyRequest {
  string organization_id = 1;
}

message ListAttendancePolicyResponse {
  repeated AttendancePolicy policies = 1;
  string message = 2;
  bool success = 3;
}

/* ============================================================
   NETWORK POLICY CRUD (IP restriction)
============================================================ */

message NetworkPolicyRequest {
  string organization_id = 1;
  string name = 2;
  string enforce_on = 3; // "ATTENDANCE" | "LOGIN" | "BOTH"
  repeated string allowed_ips = 4;
}

message UpdateNetworkPolicyRequest {
  string policy_id = 1;
  NetworkPolicyRequest data = 2;
}

message NetworkPolicy {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string enforce_on = 4;
  repeated string allowed_ips = 5;
}

message NetworkPolicyResponse {
  NetworkPolicy policy = 1;
}

message ListNetworkPolicyRequest {
  string organization_id = 1;
}

message ListNetworkPolicyResponse {
  repeated NetworkPolicy policies = 1;
}

/* ============================================================
   GEO FENCE CRUD
============================================================ */

message GeoFenceRequest {
  string organization_id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  int32 radius_meters = 5;
}

message UpdateGeoFenceRequest {
  string geofence_id = 1;
  GeoFenceRequest data = 2;
}

message GeoFence {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  double latitude = 4;
  double longitude = 5;
  int32 radius_meters = 6;
}

message GeoFenceResponse {
  GeoFence geofence = 1;
}

message ListGeoFenceRequest {
  string organization_id = 1;
}

message ListGeoFenceResponse {
  repeated GeoFence geofences = 1;
}

message MonthlyOrgAttendanceRequest {
  string organization_id = 1;
  string month = 2; // "YYYY-MM"
}

message MonthlyStats {
  string avg_check_in = 1;
  string avg_check_out = 2;
  double avg_gross_hours = 3;
  double avg_effective_hours = 4;

  double attendance_rate = 5; // % value
  int32 total_late = 6;

  string most_late_employee = 7;       // employee_id
  string best_attendance_employee = 8; // employee_id
}

message DayAttendance {
  string date = 1;                      // formatted date, e.g. "27/11/2025"
  string raw_date = 2;                  // ISO string if you want it
  repeated AttendanceListItem attendance = 3; // ✅ correct
}

message MonthlyOrgAttendanceResponse {
  repeated DayAttendance days = 1;
  MonthlyStats stats = 4;
  bool success = 2;
  string message = 3;
}

message AttendanceReportRequest {
  string organization_id = 1;
  string department_id = 2;   // optional
  string designation_id = 3;  // optional
  string employee_id = 4;     // optional
  string start_date = 5;      // optional
  string end_date = 6;        // optional
}

// ----------------------------------------------------------
// RESPONSE when report is INITIATED (returned immediately)
// ----------------------------------------------------------
message AttendanceReportInitResponse {
  string report_id = 1;  // MongoDB ID of AttendanceReports table
  string status = 2;     // INITIATED
  string message = 3;    // "Report generation started"
  bool success = 4;
}

// ----------------------------------------------------------
// REQUEST to fetch processed report result from DB
// ----------------------------------------------------------
message GetAttendanceReportResultRequest {
  string report_id = 1;
}

// ----------------------------------------------------------
// Response with final report data or failure
// ----------------------------------------------------------
message GetAttendanceReportResultResponse {
  ReportListItem report = 1;
  bool success = 2;
  string message = 3;
}


message ListAttendanceReportsRequest {
  string organization_id = 1;
  uint32 page = 2;    // optional
  uint32 limit = 3;   // optional
}

message ReportListItem {
  string id = 1;
  string organization_id = 2;
  string department_id = 3;
  string designation_id = 4;
  string employee_id = 5;

  string status = 6;
  
  string start_date = 7;
  string end_date = 8;
  
  string initiated_at = 9;
  string started_at = 10;
  string completed_at = 11;
  string failed_at = 12;
  
  string failing_reason = 13;
  
  string responseData = 14;
  string pdf_url = 15;
}

message ListAttendanceReportsResponse {
  repeated ReportListItem reports = 1;
  uint32 page = 2;
  uint32 limit = 3;
  uint32 total = 4;
  bool success = 5;
}
