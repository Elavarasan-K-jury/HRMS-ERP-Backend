syntax = "proto3";

package subscription_plan;

/* ===============================
   SERVICES
================================ */
service SubscriptionPlanService {
  rpc CreateSubscriptionPlan(CreateSubscriptionPlanRequest)
      returns (SubscriptionPlanResponse);

  rpc GetSubscriptionPlan(GetSubscriptionPlanRequest)
      returns (SubscriptionPlanResponse);

  rpc ListSubscriptionPlans(ListSubscriptionPlansRequest)
      returns (ListSubscriptionPlansResponse);

  rpc UpdateSubscriptionPlan(UpdateSubscriptionPlanRequest)
      returns (SubscriptionPlanResponse);

  rpc DeleteSubscriptionPlan(DeleteSubscriptionPlanRequest)
      returns (BaseResponse);

  /* -------- Plan Features -------- */
  rpc AddPlanFeature(AddPlanFeatureRequest) returns (PlanFeatureResponse);

  rpc ListPlanFeatures(ListPlanFeaturesRequest)
      returns (PlanFeatureListResponse);

  rpc RemovePlanFeature(DeletePlanFeatureRequest) returns (BaseResponse);

  rpc UpdatePlanFeature(UpdatePlanFeatureRequest) returns (PlanFeatureResponse);
}

/* ===============================
   COMMON REQUESTS
================================ */
message GetSubscriptionPlanRequest { string id = 1; }

message DeleteSubscriptionPlanRequest { string id = 1; }

message DeletePlanFeatureRequest { string id = 1; }

/* ===============================
   PAGINATION (STANDARD)
================================ */
message ListSubscriptionPlansRequest {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
  string sort_by = 4;
  string sort_order = 5;
}

message ListPlanFeaturesRequest { string plan_id = 1; }

/* ===============================
   CREATE / UPDATE
================================ */
message CreateSubscriptionPlanRequest {
  string name = 1;
  string description = 2;
  double monthly_price = 3;
  double yearly_price = 4;
  int32 trial_days = 5;
  double gst = 6;
}

message UpdateSubscriptionPlanRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  double monthly_price = 4;
  double yearly_price = 5;
  bool is_active = 6;
  double gst = 7;
}

/* ===============================
   PLAN FEATURE
================================ */
message AddPlanFeatureRequest {
  string plan_id = 1;
  string key = 2;
  double value = 3;
  string unit = 4;
  bool is_unlimited = 5;
}

/* ===============================
   MODELS
================================ */
message SubscriptionPlan {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_active = 4;
  double monthly_price = 5;
  double yearly_price = 6;
  double gst = 7;
  int32 trial_days = 8;
  string created_at = 9;
  string updated_at = 10;
  repeated SubscriptionPlanFeature features = 11;
}

message SubscriptionPlanFeature {
  string id = 1;
  string plan_id = 2;
  string key = 3;
  double value = 4;
  string unit = 5;
  bool is_unlimited = 6;
}

/* ===============================
   RESPONSES (STANDARDIZED)
================================ */
message SubscriptionPlanResponse {
  bool success = 1;
  string message = 2;
  SubscriptionPlan data = 3;
}

message ListSubscriptionPlansResponse {
  bool success = 1;
  string message = 2;

  repeated SubscriptionPlan data = 3;

  int32 total = 4;
  int32 page = 5;
  int32 limit = 6;
  int32 total_pages = 7;
}

message PlanFeatureResponse {
  bool success = 1;
  string message = 2;
  SubscriptionPlanFeature data = 3;
}

message PlanFeatureListResponse {
  bool success = 1;
  string message = 2;
  repeated SubscriptionPlanFeature data = 3;
}

/* ===============================
   BASE RESPONSE
================================ */
message BaseResponse {
  bool success = 1;
  string message = 2;
}

message UpdatePlanFeatureRequest {
  string id = 1; // feature id
  double value = 2;
  string unit = 3;
  bool is_unlimited = 4;
}