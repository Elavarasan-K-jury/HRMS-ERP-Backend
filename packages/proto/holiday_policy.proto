syntax = "proto3";

package holiday_policy;

service HolidayPolicyService {
  rpc CreateHolidayPolicy (CreateHolidayPolicyRequest) returns (HolidayPolicyResponse);
  rpc UpdateHolidayPolicy (UpdateHolidayPolicyRequest) returns (HolidayPolicyResponse);
  rpc DeleteHolidayPolicy (DeleteHolidayPolicyRequest) returns (DeleteHolidayPolicyResponse);

  rpc GetHolidayPolicy    (GetHolidayPolicyRequest)    returns (HolidayPolicyResponse);
  rpc ListHolidayPolicies (ListHolidayPoliciesRequest) returns (ListHolidayPoliciesResponse);
}

/* =============== Holiday Policy Object =============== */

message HolidayPolicy {
  string id              = 1;
  string organization_id = 2;
  string name            = 3;
  bool   is_active       = 4;

  string created_at      = 6;
  string updated_at      = 7;
}

/* =============== CREATE / UPDATE =============== */

message CreateHolidayPolicyRequest {
  string organization_id = 1;
  string name            = 2;
}

message UpdateHolidayPolicyRequest {
  string policy_id       = 1;
  string name            = 2;
  bool   is_active       = 3;
}

/* =============== DELETE =============== */

message DeleteHolidayPolicyRequest {
  string policy_id = 1;
}

message DeleteHolidayPolicyResponse {
  bool success = 1;
  string message = 2;
}

/* =============== GET / LIST =============== */

message GetHolidayPolicyRequest {
  string policy_id = 1;
}

message HolidayPolicyResponse {
  HolidayPolicy policy = 1;
  string message       = 2;
}

message ListHolidayPoliciesRequest {
  string organization_id = 1;
  bool   is_active_only  = 2;
}

message ListHolidayPoliciesResponse {
  repeated HolidayPolicy policies   = 1;
  int32                  total_count = 2;
}
