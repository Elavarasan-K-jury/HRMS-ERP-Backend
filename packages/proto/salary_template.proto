syntax = "proto3";

package salary_template;

/* =========================================================
   COMMON
========================================================= */
message DefaultResponse {
  bool success = 1;
  string message = 2;
}

message PaginationMeta {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
  int32 total_pages = 4;
}

/* =========================================================
   COMPONENT DEFINITION (FULLY ALIGNED)
========================================================= */
message ComponentDefinition {
  string id = 1;
  string key = 2;
  string name = 3;

  string type = 4;     // earning | deduction | benefit
  string category = 5; // recurring | statutory

  string defaultFormula = 6;
  string description = 7;

  bool isTaxable = 8;
  bool isVariable = 9;
  bool isStatutory = 10;

  bool includeInCTC = 11;
  bool includeInGross = 12;

  int32 displayOrder = 13;

  bool isActive = 14;
  bool isDefault = 15;
  bool isDeletable = 16;

  string organizationId = 17;
}

/* =========================================================
   TEMPLATE COMPONENT (RANGE-SCOPED)
========================================================= */
message SalaryTemplateComponent {
  string id = 1;

  string component_id = 2;
  ComponentDefinition component = 3;

  string formula = 4;
  double value = 5;

  int32 priority = 6;
  double min_value = 7;
  double max_value = 8;

  string condition = 9;
}

/* =========================================================
   SALARY TEMPLATE RANGE
========================================================= */
message SalaryTemplateRange {
  string id = 1;

  double gross_low = 2;
  optional double gross_high = 3;

  double ctc_low = 4;
  optional double ctc_high = 5;

  string label = 6;

  string createdAt = 7;
  string updatedAt = 8;
  string deletedAt = 9;

  repeated SalaryTemplateComponent components = 10;
}

/* =========================================================
   SALARY TEMPLATE
========================================================= */
message SalaryTemplate {
  string id = 1;
  string organizationId = 2;

  string name = 3;
  string description = 4;

  repeated string departments = 5;
  repeated string designations = 6;

  bool isDefault = 7;
  bool isActive = 8;

  int32 version = 9;
  string baseTemplateId = 10;

  string createdAt = 11;
  string updatedAt = 12;
  string deletedAt = 13;

  repeated SalaryTemplateRange ranges = 14;
}

/* =========================================================
   1️⃣ LIST TEMPLATES
========================================================= */
message ListSalaryTemplatesRequest {
  int32 page = 1;
  optional int32 per_page = 2;

  string search = 3;

  string sort_by = 4;
  string sort_order = 5;

  string organization_id = 6;
}

message ListSalaryTemplatesResponse {
  bool success = 1;
  string message = 2;

  repeated SalaryTemplate data = 3;

  int32 total = 4;
  int32 page = 5;
  int32 limit = 6;
  int32 total_pages = 7;
}

/* =========================================================
   2️⃣ UPSERT TEMPLATE (META ONLY)
========================================================= */
message UpsertSalaryTemplateRequest {
  string template_id = 1; // empty = create
  string organization_id = 2;

  string name = 3;
  string description = 4;

  repeated string departments = 5;
  repeated string designations = 6;

  bool isDefault = 7;
  bool isActive = 8;
}

message UpsertSalaryTemplateResponse {
  bool success = 1;
  string message = 2;

  SalaryTemplate data = 3;
}

/* =========================================================
   3️⃣ DELETE TEMPLATE
========================================================= */
message DeleteSalaryTemplateRequest {
  string template_id = 1;
  string organization_id = 2;
}

message DeleteSalaryTemplateResponse {
  bool success = 1;
  string message = 2;
}

/* =========================================================
   SERVICE
========================================================= */
service SalaryTemplateService {

  rpc ListSalaryTemplates(ListSalaryTemplatesRequest)
      returns (ListSalaryTemplatesResponse);

  rpc UpsertSalaryTemplate(UpsertSalaryTemplateRequest)
      returns (UpsertSalaryTemplateResponse);

  rpc DeleteSalaryTemplate(DeleteSalaryTemplateRequest)
      returns (DeleteSalaryTemplateResponse);
}
