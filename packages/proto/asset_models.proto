syntax = "proto3";

package asset_models;

// =============================
// 🔹 Service
// =============================
service AssetModelService {
  rpc CreateAssetModel (CreateAssetModelRequest) returns (AssetModelResponse);
  rpc GetAssetModel    (GetAssetModelRequest)    returns (AssetModelResponse);
  rpc ListAssetModels  (ListAssetModelsRequest)  returns (ListAssetModelsResponse);
  rpc UpdateAssetModel (UpdateAssetModelRequest) returns (AssetModelResponse);
  rpc DeleteAssetModel (DeleteAssetModelRequest) returns (DeleteAssetModelResponse);
}

// =============================
// 🔹 Requests
// =============================
message CreateAssetModelRequest {
  string organization_id = 1;
  string category_id     = 2;
  string brand           = 3;
  string model_name      = 4;
  string code            = 5;
  string description     = 6;
  string specs           = 7;
  bool   is_active       = 8;
}

message GetAssetModelRequest {
  string id = 1;
}

message UpdateAssetModelRequest {
  string id              = 1;
  string organization_id = 2;
  string category_id     = 3;
  string brand           = 4;
  string model_name      = 5;
  string code            = 6;
  string description     = 7;
  string specs           = 8;
  bool   is_active       = 9;
}

message DeleteAssetModelRequest {
  string id = 1;
}

// =============================
// 🔹 List Request (Pagination + Filters)
// =============================
message ListAssetModelsRequest {
  string organization_id = 1;
  string category_id     = 2;

  int32 page             = 3;
  int32 limit            = 4;
  string search          = 5;
  string sort_by         = 6;
  string sort_order      = 7;
}

// =============================
// 🔹 Asset Model Object
// =============================
message AssetModel {
  string id              = 1;
  string organization_id = 2;
  string category_id     = 3;
  string brand           = 4;
  string model_name      = 5;
  string code            = 6;
  string description     = 7;
  string specs           = 8;
  bool   is_active       = 9;
  string created_at      = 10;
  string updated_at      = 11;
  string deleted_at      = 12;
}

// =============================
// 🔹 Single Response Wrapper
// =============================
message AssetModelResponse {
  AssetModel model = 1;
  bool success     = 2;
  string message   = 3;
}

// =============================
// 🔹 List Response (Pagination)
// =============================
message ListAssetModelsResponse {
  repeated AssetModel models = 1;
  int32 total               = 2;
  int32 page                = 3;
  int32 limit               = 4;
  int32 total_pages         = 5;
  bool success              = 6;
  string message            = 7;
}

// =============================
// 🔹 Delete Response
// =============================
message DeleteAssetModelResponse {
  bool success = 1;
  string message = 2;
}
