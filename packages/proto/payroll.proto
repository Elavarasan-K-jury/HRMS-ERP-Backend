syntax = "proto3";

package payroll;

import "google/protobuf/timestamp.proto";

// =========================================================
// ENUMS
// =========================================================

enum Gender {
  GENDER_UNSPECIFIED = 0;
  MALE = 1;
  FEMALE = 2;
  OTHER = 3;
}

enum AttendanceStatus {
  ATTENDANCE_STATUS_UNSPECIFIED = 0;
  PRESENT = 1;
  ABSENT = 2;
  HALF_DAY = 3;
  ON_LEAVE = 4;
}

enum ExpenseStatus {
  PENDING = 0;
  APPROVED = 1;
  REJECTED = 2;
}

enum ExpenseType {
  OTHER = 0;
  TRAVEL = 1;
  FOOD = 2;
  ACCOMMODATION = 3;
}

// =========================================================
// NESTED OBJECTS
// =========================================================

message GeoLocation {
  double latitude = 1;
  double longitude = 2;
}

message AttendanceRaw {
  string id = 1;
  string organization_id = 2;
  string employee_id = 3;
  string date = 4;
  string check_in = 5;
  string check_out = 6; // Nullable in data
  GeoLocation location = 7;
  double gross_hours = 8;
  double effective_hours = 9;
  int32 late_arrival_minutes = 10;
  AttendanceStatus status = 11;
  bool is_holiday = 12;
  string mode = 13; // e.g., "OFFICE"
  string created_at = 14;
  string updated_at = 15;
}

message AttendanceRecord {
  string day = 1;
  string day_text = 2;
  AttendanceStatus status = 3;
  string start_time = 4;
  string end_time = 5;
  string total_hours_gross = 6;
  string total_effective_hours = 7;
  AttendanceRaw raw = 8; // Nullable if no punch-in
}

message SalaryStructure {
  string id = 1;
  double gross_annual = 2;
  string effective_from = 3;
  string effective_to = 4;
  bool deduct_from_in_hand = 5;
  string status = 6;
  bool is_current_active = 7;
  string employee_id = 8;
  string template_id = 9;
}

message Expense {
  string id = 1;
  string organization_id = 2;
  string employee_id = 3;
  ExpenseType type = 4;
  double amount = 5;
  string description = 6;
  string receipt_url = 7;
  ExpenseStatus status = 8;
  string approver_id = 9;
  string approved_at = 10;
  string created_at = 11;
}

// =========================================================
// MAIN EMPLOYEE PAYROLL DATA
// =========================================================

message EmployeePayrollData {
  string id = 1;
  string organization_id = 2;
  string category_id = 3;
  string designation_id = 4;
  string first_name = 5;
  string last_name = 6;
  string full_name = 7;
  string employee_code = 8;
  string email = 9;
  string phone = 10;
  bool is_admin = 11;
  string alt_phone = 12;
  Gender gender = 13;
  string date_of_birth = 14;
  
  repeated AttendanceRecord attendance = 15;
  repeated SalaryStructure salary_structures = 16;
  repeated Expense my_expenses = 17;

  // Metadata
  string created_at = 18;
  string updated_at = 19;
}

// =========================================================
// SERVICE DEFINITION
// =========================================================

message GetSystemPayrollRequest {
    string year = 1;
    string month = 2;
    string organization_id = 3;
}

message GetSystemPayrollResponse {
    bool success = 1;
    string message = 2;
    repeated EmployeePayrollData data = 3;
}

// =========================================================
// PAYROLL CALCULATION
// =========================================================

message CalculatePayrollRequest {
    string organization_id = 1;
    string year = 2;
    string month = 3;
    string employee_id = 4; // optional - if provided, calculate for specific employee
}

message PayrollAttendanceSummary {
    int32 total_days = 1;
    int32 present_days = 2;
    int32 absent_days = 3;
    int32 half_day_count = 4;
    int32 late_count = 5;
    int32 holiday_count = 6;
    int32 weekoff_count = 7;
    double total_working_hours = 8;
    double effective_hours = 9;
    int32 late_arrival_minutes = 10;
}

message PayrollLeaveSummary {
    int32 total_leave_days = 1;
    repeated LeaveDetail leaves = 2;
}

message LeaveDetail {
    string leave_type = 1;
    int32 days = 2;
    string status = 3;
}

message PayrollExpenseSummary {
    double total_claimed = 1;
    double total_approved = 2;
    repeated Expense approved_expenses = 3;
}

message SalaryComponentDetail {
    string component_key = 1;
    string component_name = 2;
    string component_type = 3; // EARNING | DEDUCTION | BENEFIT
    double monthly_amount = 4;
    double annual_amount = 5;
    string formula = 6;
}

message PayrollCalculation {
    string employee_id = 1;
    string employee_name = 2;
    string employee_code = 3;

    PayrollAttendanceSummary attendance = 4;
    PayrollLeaveSummary leave = 5;
    PayrollExpenseSummary expenses = 6;

    double gross_monthly = 7;
    double total_earnings = 8;
    double total_deductions = 9;
    double total_benefits = 10;
    double expense_reimbursement = 11;
    double net_pay = 12;
    double ctc_monthly = 13;

    double deduction_for_absences = 14;
    double adjustment_for_leaves = 15;

    repeated SalaryComponentDetail salary_components = 16;
}

message CalculatePayrollResponse {
    bool success = 1;
    string message = 2;
    repeated PayrollCalculation calculations = 3;
}

service PayrollService {
    rpc GetSystemPayroll(GetSystemPayrollRequest) 
        returns (GetSystemPayrollResponse);

    rpc CalculatePayroll(CalculatePayrollRequest)
        returns (CalculatePayrollResponse);
}