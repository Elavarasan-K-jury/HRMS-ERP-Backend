syntax = "proto3";

package invoice;

/* ============================
   ENUMS
============================ */
enum InvoiceStatus {
  DRAFT = 0;
  ISSUED = 1;
  PAID = 2;
  FAILED = 3;
  CANCELLED = 4;
}

enum BillingInterval {
  MONTHLY = 0;
  YEARLY = 1;
}

enum SubscriptionStatus {
  TRIAL = 0;
  ACTIVE = 1;
  PAST_DUE = 2;
  SUSPENDED = 3;
  CANCELLED = 4;
  EXPIRED = 5;
}

enum PaymentStatus {
  PENDING = 0;
  SUCCESS = 1;
  FAILED = 2;
}

enum SortOrder {
  DESC = 0;
  ASC = 1;
}

/* ============================
   SERVICES
============================ */
service InvoiceService {
  rpc ListInvoices(ListInvoicesRequest) returns (InvoiceListResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (InvoiceResponse);
  rpc MarkInvoicePaid(MarkInvoicePaidRequest) returns (BaseResponse);
  rpc DownloadInvoice(DownloadInvoiceRequest) returns (DownloadInvoiceResponse);
  rpc RegenerateInvoicePaymentLink(RegenerateInvoicePaymentLinkRequest)
      returns (InvoiceResponse);
  rpc ProcessInvoicePayment(ProcessInvoicePaymentFuncRequest)
      returns (ProcessInvoicePaymentFuncResponse);
}

message ProcessInvoicePaymentFuncRequest {
  string id = 1;
  string payment_ref = 2;
  string payment_status = 3;
}

message ProcessInvoicePaymentFuncResponse {
  bool success = 1;
  string message = 2;
  Invoice data = 3;
}

message RegenerateInvoicePaymentLinkRequest { string invoice_id = 1; }
/* ============================
   REQUESTS
============================ */
message ListInvoicesRequest {
  string organization_id = 1; // optional
  int32 page = 2;
  int32 limit = 3;
  string search = 4;
  string sort_by = 5;
  SortOrder sort_order = 6;
}

message GetInvoiceRequest {
  string id = 1;
  string organization_id = 2;
}

message MarkInvoicePaidRequest {
  string id = 1;
  string payment_ref = 2;
  string payment_provider = 3;
}

message DownloadInvoiceRequest {
  string id = 1;
  string organization_id = 2;
}

/* ============================
   RESPONSES
============================ */
message InvoiceResponse {
  bool success = 1;
  string message = 2;
  Invoice data = 3;
}

message InvoiceListResponse {
  bool success = 1;
  repeated Invoice data = 2;
  PaginationMeta meta = 3;
}

message DownloadInvoiceResponse {
  bool success = 1;
  string filename = 2;
  string mime_type = 3;
  bytes data = 4;
}

message BaseResponse {
  bool success = 1;
  string message = 2;
}

/* ============================
   META
============================ */
message PaginationMeta {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
  int32 total_pages = 4;
}

/* ============================
   MODELS
============================ */
message Invoice {
  string id = 1;
  string invoice_number = 2;

  double amount = 3;
  double tax = 18;
  double total = 17;
  string currency = 4;
  InvoiceStatus status = 5;

  string billing_period_start = 6;
  string billing_period_end = 7;

  string issued_at = 8;
  string paid_at = 9;

  string invoice_url = 10;
  string invoice_key = 11;

  Payment payment = 12;
  Subscription subscription = 13;
  Organization organization = 14;

  string created_at = 15;
  string updated_at = 16;
}

message Payment {
  string order_id = 1;
  string link = 2;
  PaymentStatus status = 3;
  string ref = 4;
  string provider = 5;
  string expires_at = 6;
}

message Subscription {
  string id = 1;
  SubscriptionStatus status = 2;
  BillingInterval billing_interval = 3;
  double price_at_purchase = 4;
  Plan plan = 5;
}

message Plan {
  string id = 1;
  string name = 2;
}

message Organization {
  string id = 1;
  string name = 2;
  string domain = 3;
  string gst_number = 4;
  string email = 5;
  string contact_person_name = 6;
  string contact_person_number = 7;
  string note = 8;
  string industry = 9;
  int32 size = 10;
  string address = 11;
  string created_at = 12;
  string updated_at = 13;
  string deleted_at = 14;

  int32 max_employees = 15;
  int32 max_storage_in_gb = 16;
  int32 max_api_rate_per_minute = 17;
  int32 max_payroll_runs_per_month = 18;
  int32 max_leave_policies = 19;
  int32 max_admin_accounts = 20;
}
