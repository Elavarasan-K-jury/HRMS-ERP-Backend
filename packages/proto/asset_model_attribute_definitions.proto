syntax = "proto3";

package asset_model_attribute_definitions;

service AssetModelAttributeDefinitionService {
  rpc CreateAttributeDefinition(CreateAttributeDefinitionRequest) returns (AttributeDefinitionResponse);
  rpc GetAttributeDefinition(GetAttributeDefinitionRequest) returns (AttributeDefinitionResponse);
  rpc ListAttributeDefinitions(ListAttributeDefinitionsRequest) returns (ListAttributeDefinitionsResponse);
  rpc UpdateAttributeDefinition(UpdateAttributeDefinitionRequest) returns (AttributeDefinitionResponse);
  rpc DeleteAttributeDefinition(DeleteAttributeDefinitionRequest) returns (DeleteAttributeDefinitionResponse);
  rpc SyncAttributeDefinitions(SyncAttributeDefinitionsRequest) returns (SyncAttributeDefinitionsResponse);
}

message CreateAttributeDefinitionRequest {
  string asset_model_id = 1;
  string organization_id = 2;
  string label = 3;
  string key = 4;
  string field_type = 5;
  string options = 6;
  bool is_mandatory = 7;
  bool is_unique = 8;
  int32 display_order = 9;
}

message GetAttributeDefinitionRequest {
  string id = 1;
}

message UpdateAttributeDefinitionRequest {
  string id = 1;
  string label = 2;
  string key = 3;
  string field_type = 4;
  string options = 5;
  bool is_mandatory = 6;
  bool is_unique = 7;
  int32 display_order = 8;
}

message DeleteAttributeDefinitionRequest {
  string id = 1;
}

message ListAttributeDefinitionsRequest {
  string asset_model_id = 1;
  string organization_id = 2;
}

message SyncAttributeDefinitionsRequest {
  string asset_model_id = 1;
  string organization_id = 2;
  repeated AttributeDefinitionInput definitions = 3;
}

message AttributeDefinitionInput {
  string id = 1;
  string label = 2;
  string key = 3;
  string field_type = 4;
  string options = 5;
  bool is_mandatory = 6;
  bool is_unique = 7;
  int32 display_order = 8;
}

message AttributeDefinition {
  string id = 1;
  string asset_model_id = 2;
  string organization_id = 3;
  string label = 4;
  string key = 5;
  string field_type = 6;
  string options = 7;
  bool is_mandatory = 8;
  bool is_unique = 9;
  int32 display_order = 10;
  string created_at = 11;
  string updated_at = 12;
  string deleted_at = 13;
}

message AttributeDefinitionResponse {
  AttributeDefinition definition = 1;
  bool success = 2;
  string message = 3;
}

message ListAttributeDefinitionsResponse {
  repeated AttributeDefinition definitions = 1;
  bool success = 2;
  string message = 3;
}

message DeleteAttributeDefinitionResponse {
  bool success = 1;
  string message = 2;
}

message SyncAttributeDefinitionsResponse {
  repeated AttributeDefinition definitions = 1;
  bool success = 2;
  string message = 3;
}
