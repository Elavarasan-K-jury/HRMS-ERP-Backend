syntax = "proto3";

package organization_subscription;

/* ============================
   ENUMS
============================ */
enum SubscriptionStatus {
  TRIAL = 0;
  ACTIVE = 1;
  PAST_DUE = 2;
  SUSPENDED = 3;
  CANCELLED = 4;
  EXPIRED = 5;
}

enum BillingInterval {
  MONTHLY = 0;
  YEARLY = 1;
}

/* ============================
   SERVICES
============================ */
service OrganizationSubscriptionService {
  rpc CreateSubscription(CreateOrganizationSubscriptionRequest)
      returns (OrganizationSubscriptionResponse);

  rpc GetOrganizationSubscription(OrgRequest)
      returns (OrganizationSubscriptionResponse);

  rpc CancelSubscription(CancelSubscriptionRequest) returns (BaseResponse);

  rpc ChangePlan(ChangeSubscriptionPlanRequest)
      returns (OrganizationSubscriptionResponse);
}

/* ============================
   REQUESTS
============================ */
message CreateOrganizationSubscriptionRequest {
  string organization_id = 1;
  string plan_id = 2;
  BillingInterval billing_interval = 3;
}

message ChangeSubscriptionPlanRequest {
  string organization_id = 1;
  string new_plan_id = 2;
  string reason = 3;
}

message CancelSubscriptionRequest {
  string organization_id = 1;
  bool cancel_at_period_end = 2;
}

message OrgRequest { string organization_id = 1; }

/* ============================
   RESPONSES
============================ */
message OrganizationSubscriptionResponse {
  bool success = 1;
  string message = 2;
  OrganizationSubscription data = 3;
}

message SubscriptionPlanFeature {
  string id = 1;
  string plan_id = 2;
  string key = 3;
  double value = 4;
  string unit = 5;
  bool is_unlimited = 6;
}

message SubscriptionPlan {
  string id = 1;
  string name = 2;
  string description = 3;

  bool is_active = 4;

  double monthly_price = 5;
  double yearly_price = 6;
  double gst = 7;
  int32 trial_days = 8;

  string created_at = 9;
  string updated_at = 10;

  repeated SubscriptionPlanFeature features = 11;
}

message Invoice {
  string id = 1;
  string invoice_number = 2;

  double amount = 3;
  double tax = 18;
  double total = 17;
  string currency = 4;
  InvoiceStatus status = 5;

  string billing_period_start = 6;
  string billing_period_end = 7;

  string issued_at = 8;
  string paid_at = 9;

  string invoice_url = 10;
  string invoice_key = 11;

  Payment payment = 12;

  string created_at = 13;
  string updated_at = 14;
}

message Payment {
  string order_id = 1;
  string link = 2;
  PaymentStatus status = 3;
  string ref = 4;
  string provider = 5;
  string expires_at = 6;
}

enum InvoiceStatus {
  DRAFT = 0;
  ISSUED = 1;
  PAID = 2;
  FAILED = 3;
  CANCELLED = 4;
}
enum PaymentStatus {
  PENDING = 0;
  SUCCESS = 1;
  FAILED = 2;
}

/* ============================
   MODELS
============================ */
message OrganizationSubscription {
  string id = 1;
  string organization_id = 2;
  string plan_id = 3;
  string plan_name = 4;

  SubscriptionStatus status = 5;
  BillingInterval billing_interval = 6;

  double price_at_purchase = 7;

  string start_date = 8;
  string end_date = 9;
  string trial_ends_at = 10;

  bool cancel_at_period_end = 11;
  string cancelled_at = 12;
  SubscriptionPlan plan = 13;
  repeated Invoice invoices = 14;
}

/* ============================
   COMMON
============================ */
message BaseResponse {
  bool success = 1;
  string message = 2;
}
