syntax = "proto3";

package emp_onboarding_step;

service EmployeeOnboardingStepService {
  rpc CreateEmployeeOnboardingStep (CreateEmployeeOnboardingStepRequest) returns (EmployeeOnboardingStepResponse);
  rpc GetEmployeeOnboardingStep    (GetEmployeeOnboardingStepRequest)    returns (EmployeeOnboardingStepResponse);
  rpc ListEmployeeOnboardingSteps  (ListEmployeeOnboardingStepsRequest)  returns (ListEmployeeOnboardingStepsResponse);
  rpc UpdateEmployeeOnboardingStep (UpdateEmployeeOnboardingStepRequest) returns (EmployeeOnboardingStepResponse);
  rpc DeleteEmployeeOnboardingStep (DeleteEmployeeOnboardingStepRequest) returns (DeleteEmployeeOnboardingStepResponse);
}

// -----------------------------
// Requests
// -----------------------------
message CreateEmployeeOnboardingStepRequest {
  string onboarding_id = 1;
  string name          = 2;
  bool   is_active     = 3;
}

message GetEmployeeOnboardingStepRequest {
  string id = 1;
}

message UpdateEmployeeOnboardingStepRequest {
  string id            = 1;
  string onboarding_id = 2;
  string name          = 3;
  bool   is_active     = 4;
}

message DeleteEmployeeOnboardingStepRequest {
  string id = 1;
}

message ListEmployeeOnboardingStepsRequest {
  string onboarding_id = 1;
}

// -----------------------------
// Responses
// -----------------------------
message EmployeeOnboardingStep {
  string id            = 1;
  string onboarding_id = 2;
  string name          = 3;
  bool   is_active     = 4;
  string created_at    = 5;
  string updated_at    = 6;
  string deleted_at    = 7;
}

message EmployeeOnboardingStepResponse {
  EmployeeOnboardingStep step = 1;
}

message ListEmployeeOnboardingStepsResponse {
  repeated EmployeeOnboardingStep steps = 1;
}

message DeleteEmployeeOnboardingStepResponse {
  bool success = 1;
  string message = 2;
}
