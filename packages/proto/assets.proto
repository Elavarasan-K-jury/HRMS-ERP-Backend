syntax = "proto3";

package assets;

// =============================
// 🔹 Service
// =============================
service AssetService {
  rpc CreateAsset (CreateAssetRequest) returns (AssetResponse);
  rpc GetAsset    (GetAssetRequest)    returns (AssetResponse);
  rpc ListAssets  (ListAssetsRequest)  returns (ListAssetsResponse);
  rpc UpdateAsset (UpdateAssetRequest) returns (AssetResponse);
  rpc DeleteAsset (DeleteAssetRequest) returns (DeleteAssetResponse);
}

// =============================
// 🔹 Requests
// =============================
message CreateAssetRequest {
  string organization_id = 1;
  string category_id     = 2;
  string model_id        = 3;
  string serial_number   = 4;
  string asset_tag       = 5;
  string user_name       = 6;
  string password        = 7;
  string purchase_date   = 8;
  string warranty_expire = 9;
  string status          = 10;
  string location        = 11; // JSON string
}

message GetAssetRequest {
  string id = 1;
}

message UpdateAssetRequest {
  string id              = 1;
  string organization_id = 2;
  string category_id     = 3;
  string model_id        = 4;
  string serial_number   = 5;
  string asset_tag       = 6;
  string user_name       = 7;
  string password        = 8;
  string purchase_date   = 9;
  string warranty_expire = 10;
  string status          = 11;
  string location        = 12; // JSON string
}

message DeleteAssetRequest {
  string id = 1;
}

// =============================
// 🔹 List Request (Pagination + Filters)
// =============================
message ListAssetsRequest {
  string organization_id = 1;
  string category_id     = 2;
  string model_id        = 3;
  string status          = 4;
  string search          = 5;
  int32  page            = 6;
  int32  limit           = 7;
  string sort_by         = 8;
  string sort_order      = 9;
}

message Credentials {
  // ⚠️ Sensitive — consider returning only in GetAssetDetails
  string user_name       = 1;
  string password        = 2;
}

message Asset {
  string id              = 1;
  string organization_id = 2;
  string category_id     = 3;
  string model_id        = 4;

  string serial_number   = 5;
  string asset_tag       = 6;

  Credentials credentials = 7;

  string status          = 8;
  string location        = 9;

  string purchase_date   = 10;
  string warranty_expire = 11;
  string created_at      = 12;
  string updated_at      = 13;
  string deleted_at      = 14;

  // ✅ Rich joined objects (from include)
  AssetCategory category        = 15;
  AssetModel model             = 16;
  Organization organization     = 17;

  // ✅ History / relations
  repeated AssetAssignment assignments = 18;
  repeated AssetCondition conditions   = 19;

  // ✅ Helpful computed flags (optional but great for UI)
  bool is_deleted        = 20;
  bool has_assignments   = 21;
}

// =============================
// 🔹 Asset Category
// =============================
message AssetCategory {
  string id              = 1;
  string organization_id = 2;
  string name            = 3;
  string code            = 4;
  string description     = 5;
  bool is_active         = 6;

  string created_at      = 7;
  string updated_at      = 8;
  string deleted_at      = 9;
}

// =============================
// 🔹 Asset Model
// =============================
message AssetModel {
  string id              = 1;
  string organization_id = 2;
  string category_id     = 3;

  string brand           = 4;
  string model_name      = 5;
  string code            = 6;
  string description     = 7;
  string specs           = 8; // keep as string if you store JSON/text

  bool is_active         = 9;

  string created_at      = 10;
  string updated_at      = 11;
  string deleted_at      = 12;
}

// =============================
// 🔹 Organization (Minimal)
// =============================
message Organization {
  string id       = 1;
  string name     = 2;
  string domain   = 3;
  string industry = 4;
}

// =============================
// 🔹 Asset Assignment
// =============================
message AssetAssignment {
  string id           = 1;
  string asset_id     = 2;
  string employee_id  = 3;

  string status       = 4;
  string assigned_at  = 5;
  string returned_at  = 6;

  string created_at   = 7;
  string updated_at   = 8;
  string deleted_at   = 9;
}

// =============================
// 🔹 Asset Condition / Audit
// =============================
message AssetCondition {
  string id           = 1;
  string asset_id     = 2;

  string condition    = 3;
  string notes        = 4;

  string recorded_at  = 5;

  string created_at   = 6;
  string updated_at   = 7;
  string deleted_at   = 8;
}

// =============================
// 🔹 Single Response Wrapper
// =============================
message AssetResponse {
  Asset asset  = 1;
  bool success = 2;
  string message = 3;
}

// =============================
// 🔹 List Response (Pagination)
// =============================
message ListAssetsResponse {
  repeated Asset assets = 1;
  int32 total          = 2;
  int32 page           = 3;
  int32 limit          = 4;
  int32 total_pages    = 5;
  bool success         = 6;
  string message       = 7;
}

// =============================
// 🔹 Delete Response
// =============================
message DeleteAssetResponse {
  bool success = 1;
  string message = 2;
}
