syntax = "proto3";

package usage_type;

// ─────────────────────────────────────────────────────────────────────────────
//  Usage Type Service — Organization-scoped master data
// ─────────────────────────────────────────────────────────────────────────────
service UsageTypeService {
  rpc CreateUsageType (CreateUsageTypeRequest) returns (UsageTypeResponse);
  rpc GetUsageType    (GetUsageTypeRequest)    returns (UsageTypeResponse);
  rpc ListUsageTypes  (ListUsageTypesRequest)  returns (ListUsageTypesResponse);
  rpc UpdateUsageType (UpdateUsageTypeRequest) returns (UsageTypeResponse);
  rpc DeleteUsageType (DeleteUsageTypeRequest) returns (DeleteUsageTypeResponse);
  rpc UpdateUsageTypeStatus (UpdateUsageTypeStatusRequest) returns (UsageTypeResponse);
}

message UsageType {
  string id              = 1;
  string organization_id = 2;
  string name            = 3;
  string description     = 4;
  bool   is_active       = 5;
  string created_at      = 6;
  string updated_at      = 7;
}

message CreateUsageTypeRequest {
  string organization_id = 1;
  string name            = 2;
  string description     = 3;
  bool   is_active       = 4;
}

message GetUsageTypeRequest {
  string id              = 1;
  string organization_id = 2;
}

message ListUsageTypesRequest {
  string organization_id = 1;
  int32  page            = 2;
  int32  limit           = 3;
  string search          = 4;
  string sort_by         = 5;
  string sort_order      = 6;
  bool   is_active_only  = 7;
}

message UpdateUsageTypeRequest {
  string id              = 1;
  string organization_id = 2;
  string name            = 3;
  string description     = 4;
  bool   is_active       = 5;
}

message UpdateUsageTypeStatusRequest {
  string id              = 1;
  string organization_id = 2;
  bool   is_active       = 3;
}

message DeleteUsageTypeRequest {
  string id              = 1;
  string organization_id = 2;
}

message UsageTypeResponse {
  UsageType usage_type = 1;
  string message       = 2;
  bool   success       = 3;
}

message ListUsageTypesResponse {
  repeated UsageType usage_types = 1;
  int32 total                     = 2;
  int32 page                      = 3;
  int32 limit                     = 4;
  int32 total_pages               = 5;
  bool  success                   = 6;
  string message                  = 7;
}

message DeleteUsageTypeResponse {
  bool   success = 1;
  string message = 2;
}
