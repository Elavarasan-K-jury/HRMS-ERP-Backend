syntax = "proto3";

package asset_condition;

// =============================
// 🔹 Service
// =============================
service AssetConditionService {
  rpc CreateAssetCondition (CreateAssetConditionRequest) returns (AssetConditionResponse);
  rpc GetAssetCondition    (GetAssetConditionRequest)    returns (AssetConditionResponse);
  rpc ListAssetConditions  (ListAssetConditionsRequest)  returns (ListAssetConditionsResponse);
  rpc UpdateAssetCondition (UpdateAssetConditionRequest) returns (AssetConditionResponse);
  rpc DeleteAssetCondition (DeleteAssetConditionRequest) returns (DeleteAssetConditionResponse);
}

// =============================
// 🔹 Requests
// =============================

// Create
message CreateAssetConditionRequest {
  string organization_id     = 1;
  string assignment_id       = 2;
  string employee_id         = 3;
  string acknowledged_by     = 4;     // optional
  string report_date         = 5;
  string description         = 6;
  string ratings             = 7;
  string images              = 8;     // JSON string
  string action_taken        = 9;
  string acknowledged_date   = 10;    // optional
  string status              = 11;
}

// Get
message GetAssetConditionRequest {
  string id = 1;
}

// Update
message UpdateAssetConditionRequest {
  string id                  = 1;
  string organization_id     = 2;
  string assignment_id       = 3;
  string employee_id         = 4;
  string acknowledged_by     = 5;
  string report_date         = 6;
  string description         = 7;
  string ratings             = 8;
  string images              = 9;   // JSON string
  string action_taken        = 10;
  string acknowledged_date   = 11;
  string status              = 12;
}

// Delete
message DeleteAssetConditionRequest {
  string id = 1;
}

// =============================
// 🔹 List Request (Pagination + Filters)
// =============================
message ListAssetConditionsRequest {
  string organization_id   = 1;
  string assignment_id     = 2;
  string employee_id       = 3;
  string status            = 4;
  string search            = 5;
  int32  page              = 6;
  int32  limit             = 7;
  string sort_by           = 8;
  string sort_order        = 9;
}

// =============================
// 🔹 Asset Condition Object
// =============================
message AssetCondition {
  string id                 = 1;
  string organization_id    = 2;
  string assignment_id      = 3;
  string employee_id        = 4;
  string acknowledged_by    = 5;
  string report_date        = 6;
  string description        = 7;
  string ratings            = 8;
  string images             = 9;   // JSON string
  string action_taken       = 10;
  string acknowledged_date  = 11;
  string status             = 12;
  string created_at         = 13;
  string updated_at         = 14;
  string deleted_at         = 15;
}

// =============================
// 🔹 Single Response Wrapper
// =============================
message AssetConditionResponse {
  AssetCondition condition = 1;
  bool success             = 2;
  string message           = 3;
}

// =============================
// 🔹 List Response (Pagination)
// =============================
message ListAssetConditionsResponse {
  repeated AssetCondition conditions = 1;
  int32 total                       = 2;
  int32 page                        = 3;
  int32 limit                       = 4;
  int32 total_pages                 = 5;
  bool success                      = 6;
  string message                    = 7;
}

// =============================
// 🔹 Delete Response
// =============================
message DeleteAssetConditionResponse {
  bool success    = 1;
  string message  = 2;
}
