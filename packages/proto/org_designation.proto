syntax = "proto3";

package org_designation;

// ─────────────────────────────────────────────────────────────────────────────
//  Organization Designation Service – CRUD + List
// ─────────────────────────────────────────────────────────────────────────────
service OrgDesignationService {
  rpc CreateDesignation (CreateDesignationRequest) returns (DesignationResponse);
  rpc GetDesignation    (GetDesignationRequest)    returns (DesignationResponse);
  rpc ListDesignations  (ListDesignationsRequest)  returns (ListDesignationsResponse);
  rpc ListAllDesignations  (ListAllDesignationsRequest)  returns (ListAllDesignationsResponse);
  rpc UpdateDesignation (UpdateDesignationRequest) returns (DesignationResponse);
  rpc DeleteDesignation (DeleteDesignationRequest) returns (DeleteDesignationResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Request Messages
// ─────────────────────────────────────────────────────────────────────────────
message CreateDesignationRequest {
  string organization_id = 1;
  string department_id   = 2;  // optional
  string name            = 3;
  string level           = 4;  // optional
  string description     = 5;  // optional
  string band_id         = 6;  // optional
}

message GetDesignationRequest {
  string id = 1;
}

message UpdateDesignationRequest {
  string id              = 1;
  string organization_id = 2;
  string department_id   = 3;
  string name            = 4;
  string level           = 5;
  string description     = 6;
  string band_id         = 7;  // optional
}

message DeleteDesignationRequest {
  string id = 1;
}

message ListDesignationsRequest {
  string organization_id = 1;
  string department_id   = 2;  // optional filter
  // pagination
  int32  page            = 3;
  int32  limit           = 4;
  string search          = 5;
  string sort_by         = 6;
  string sort_order      = 7;
}
message ListAllDesignationsRequest {
  string organization_id = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Response Messages
// ─────────────────────────────────────────────────────────────────────────────

// ------------------------------
// Base Designation Message
// ------------------------------
message DesignationOnly {
  string id          = 1;
  string name        = 2;
  string level       = 3;
  string band_id     = 4;
  string band_name   = 5;
}

message Designation {
  string id              = 1;
  string organization_id = 2;
  string department_id   = 3;
  string name            = 4;
  string level           = 5;
  string description     = 6;
  string created_at      = 7;
  string updated_at      = 8;
  string deleted_at      = 9;

  // New nested fields
  Organization organization = 10;
  Department department = 11;
  repeated Employee employees = 12;
  int32 employee_count = 13;
  string band_id = 14;
  Band band = 15;
}

// ------------------------------
// Band Message
// ------------------------------
message Band {
  string id          = 1;
  string name        = 2;
  string description = 3;
  int32  order       = 4;
}


// ------------------------------
// Organization Message
// ------------------------------
message Organization {
  string id                     = 1;
  string name                   = 2;
  string domain                 = 3;
  string gst_number             = 4;
  string email                  = 5;
  string contact_person_name    = 6;
  string contact_person_number  = 7;
  string note                   = 8;
  string industry               = 9;
  int32 size                    = 10;
  string address                = 11;
  string created_at             = 12;
  string updated_at             = 13;
}

// ------------------------------
// Department Message
// ------------------------------
message Department {
  string id                      = 1;
  string organization_id          = 2;
  string name                     = 3;
  string code                     = 4;
  string department_head_id       = 5;
  string department_head_start_date = 6;
  string description              = 7;
  string note                     = 8;
  string created_at               = 9;
  string updated_at               = 10;
}

// ------------------------------
// Employee Message
// ------------------------------
message Employee {
  string id              = 1;
  string organization_id = 2;
  string category_id     = 3;
  string designation_id  = 4;
  string employee_code   = 5;
  string first_name      = 6;
  string last_name       = 7;
  string full_name       = 8;
  string email           = 9;
  string phone           = 10;
  string alt_phone       = 11;
  string gender          = 12;
  string date_of_birth   = 13;
  string created_at      = 14;
  string updated_at      = 15;
  string deleted_at      = 16;
}

message DesignationResponse {
  Designation designation = 1;
  string      message     = 2;
  bool        success     = 3;
}

// ------------------------------
// Response for list call
// ------------------------------
message ListDesignationsResponse {
  repeated Designation designations = 1;
  int32 total                       = 2;
  int32 page                        = 3;
  int32 limit                       = 4;
  int32 total_pages                 = 5;
  bool success                      = 6;
  string message                    = 7;
}
message ListAllDesignationsResponse {
  repeated DesignationOnly designations = 1;
  bool success                      = 2;
  string message                    = 3;
}

message DeleteDesignationResponse {
  bool   success = 1;
  string message = 2;
}