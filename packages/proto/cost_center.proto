syntax = "proto3";

package cost_center;

// ─────────────────────────────────────────────────────────────────────────────
//  Cost Center Service – CRUD + Employee Assignment
// ─────────────────────────────────────────────────────────────────────────────
service CostCenterService {
  rpc CreateCostCenter (CreateCostCenterRequest) returns (CostCenterResponse);
  rpc GetCostCenter    (GetCostCenterRequest)    returns (CostCenterResponse);
  rpc ListCostCenters  (ListCostCentersRequest)  returns (ListCostCentersResponse);
  rpc UpdateCostCenter (UpdateCostCenterRequest) returns (CostCenterResponse);
  rpc DeleteCostCenter (DeleteCostCenterRequest) returns (DeleteCostCenterResponse);

  rpc ListCostCenterEmployees (ListCostCenterEmployeesRequest) returns (ListCostCenterEmployeesResponse);
  rpc AssignEmployeesToCostCenter (AssignEmployeesRequest) returns (AssignEmployeesResponse);
  rpc RemoveEmployeeFromCostCenter (RemoveEmployeeRequest) returns (RemoveEmployeeResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Request Messages
// ─────────────────────────────────────────────────────────────────────────────
message CreateCostCenterRequest {
  string organization_id = 1;
  string name            = 2;
  string code            = 3;
  string description     = 4;  // optional
}

message GetCostCenterRequest {
  string id = 1;
}

message UpdateCostCenterRequest {
  string id              = 1;
  string organization_id = 2;
  string name            = 3;
  string code            = 4;
  string description     = 5;
  optional bool is_active = 6;
}

message DeleteCostCenterRequest {
  string id              = 1;
  string organization_id = 2;
}

message ListCostCentersRequest {
  string organization_id = 1;
  int32  page            = 2;
  int32  limit           = 3;
  string search          = 4;
  string sort_by         = 5;
  string sort_order      = 6;
}

// ------------------------------
// Employee assignment
// ------------------------------
message ListCostCenterEmployeesRequest {
  string cost_center_id  = 1;
  string organization_id = 2;
  int32  page            = 3;
  int32  limit           = 4;
  string search          = 5;
}

message AssignEmployeesRequest {
  string cost_center_id  = 1;
  string organization_id = 2;
  repeated string employee_ids = 3;
}

message RemoveEmployeeRequest {
  string cost_center_id  = 1;
  string organization_id = 2;
  string employee_id     = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Response Messages
// ─────────────────────────────────────────────────────────────────────────────
message CostCenter {
  string id              = 1;
  string organization_id = 2;
  string name            = 3;
  string code            = 4;
  string description     = 5;
  bool   is_active       = 6;
  int32  employee_count  = 7;
  string created_at      = 8;
  string updated_at      = 9;
  string deleted_at      = 10;
}

message CostCenterResponse {
  CostCenter cost_center = 1;
  string     message     = 2;
  bool       success     = 3;
}

message ListCostCentersResponse {
  repeated CostCenter cost_centers = 1;
  int32 total                       = 2;
  int32 page                        = 3;
  int32 limit                       = 4;
  int32 total_pages                 = 5;
  bool success                      = 6;
  string message                    = 7;
}

message DeleteCostCenterResponse {
  bool   success = 1;
  string message = 2;
}

message CostCenterEmployee {
  string id                    = 1;
  string organization_id       = 2;
  string employee_code         = 3;
  string first_name            = 4;
  string last_name             = 5;
  string full_name             = 6;
  string email                 = 7;
  string designation_name      = 8;
  string department_name       = 9;
  string reporting_manager_name = 10;
  string reporting_manager_id  = 11;
  string profile_image_file_id = 12;
  string profile_image         = 13;
}

message ListCostCenterEmployeesResponse {
  repeated CostCenterEmployee employees = 1;
  int32 total                           = 2;
  int32 page                            = 3;
  int32 limit                           = 4;
  int32 total_pages                     = 5;
  bool success                          = 6;
  string message                        = 7;
}

message AssignEmployeesResponse {
  bool   success       = 1;
  string message       = 2;
  int32  assigned_count = 3;
}

message RemoveEmployeeResponse {
  bool   success = 1;
  string message = 2;
}