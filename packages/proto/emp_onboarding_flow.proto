syntax = "proto3";

package emp_onboarding_flow;


service EmployeeOnboardingFlowService {
  rpc CreateEmployeeOnboardingFlow (CreateEmployeeOnboardingFlowRequest) returns (EmployeeOnboardingFlowResponse);
  rpc GetEmployeeOnboardingFlow    (GetEmployeeOnboardingFlowRequest)    returns (EmployeeOnboardingFlowResponse);
  rpc ListEmployeeOnboardingFlows  (ListEmployeeOnboardingFlowsRequest)  returns (ListEmployeeOnboardingFlowsResponse);
  rpc UpdateEmployeeOnboardingFlow (UpdateEmployeeOnboardingFlowRequest) returns (EmployeeOnboardingFlowResponse);
  rpc DeleteEmployeeOnboardingFlow (DeleteEmployeeOnboardingFlowRequest) returns (DeleteEmployeeOnboardingFlowResponse);
}

// ---------- Create ----------
message CreateEmployeeOnboardingFlowRequest {
  string organization_id = 1;
  string name            = 2;
  string description     = 3;
  int32  steps           = 4;
  int32  estimated_days  = 5;
}

// ---------- Get ----------
message GetEmployeeOnboardingFlowRequest {
  string id = 1;
}

// ---------- Update ----------
message UpdateEmployeeOnboardingFlowRequest {
  string id              = 1;
  string organization_id = 2;
  string name            = 3;
  string description     = 4;
  int32  steps           = 5;
  int32  estimated_days  = 6;
}

// ---------- Delete ----------
message DeleteEmployeeOnboardingFlowRequest {
  string id = 1;
}

message DeleteEmployeeOnboardingFlowResponse {
  bool success = 1;
  string message = 2;
}

// ---------- Entity ----------
message EmployeeOnboardingFlow {
  string id              = 1;
  string organization_id = 2;
  string name            = 3;
  string description     = 4;
  int32  steps           = 5;
  int32  estimated_days  = 6;
  string created_at      = 7;
  string updated_at      = 8;
  string deleted_at      = 9;
  Organization organization = 10;

  // ✅ New nested list of steps
  repeated EmployeeOnboardingStep steps_list = 11;
}

// ── New: step message
message EmployeeOnboardingStep {
  string id             = 1;
  string onboarding_id  = 2;
  string name           = 3;
  bool   is_active      = 4;
  string created_at     = 5;
  string updated_at     = 6;
  string deleted_at     = 7;

  // ✅ New nested features per step
  repeated OnboardingStepFeature features = 8;
}

// ── New: feature message
message OnboardingStepFeature {
  string id            = 1;
  string step_id       = 2;
  string feature_name  = 3;
  string feature_type  = 4; // e.g. "text" | "email" | "file" | "number" | "select"
  bool   has_options   = 5;
  string options       = 6; // JSON string (e.g. '["India","USA"]' or "[]")
}
message Organization {
  string id                     = 1;
  string name                   = 2;
  string domain                 = 3;
  string gst_number             = 4;
  string email                  = 5;
  string contact_person_name    = 6;
  string contact_person_number  = 7;
  string note                   = 8;
  string industry               = 9;
  int32 size                    = 10;
  string address                = 11;
  string created_at             = 12;
  string updated_at             = 13;
}


// ---------- Responses ----------
message EmployeeOnboardingFlowResponse {
  EmployeeOnboardingFlow flow = 1;
  string message = 2;
  bool success = 3;
}

message ListEmployeeOnboardingFlowsRequest {
  string organization_id = 1;
  int32  page            = 2;
  int32  limit           = 3;
  string search          = 4;
  string sort_by         = 5;
  string sort_order      = 6;
}

message ListEmployeeOnboardingFlowsResponse {
  repeated EmployeeOnboardingFlow flows = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
  string message = 6;
  bool success = 7;
}
