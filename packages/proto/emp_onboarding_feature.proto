syntax = "proto3";

package emp_onboarding_feature;

service EmployeeOnboardingFeatureService {
  rpc CreateEmployeeOnboardingFeature (CreateEmployeeOnboardingFeatureRequest) returns (EmployeeOnboardingFeatureResponse);
  rpc GetEmployeeOnboardingFeature    (GetEmployeeOnboardingFeatureRequest)    returns (EmployeeOnboardingFeatureResponse);
  rpc ListEmployeeOnboardingFeatures  (ListEmployeeOnboardingFeaturesRequest)  returns (ListEmployeeOnboardingFeaturesResponse);
  rpc UpdateEmployeeOnboardingFeature (UpdateEmployeeOnboardingFeatureRequest) returns (EmployeeOnboardingFeatureResponse);
  rpc DeleteEmployeeOnboardingFeature (DeleteEmployeeOnboardingFeatureRequest) returns (DeleteEmployeeOnboardingFeatureResponse);
}

// -----------------------------
// Requests
// -----------------------------
message CreateEmployeeOnboardingFeatureRequest {
  string step_id        = 1;
  string feature_name   = 2;
  string feature_type   = 3;
  bool   has_options    = 4;
  string options        = 5; // JSON string if applicable
}

message GetEmployeeOnboardingFeatureRequest {
  string id = 1;
}

message UpdateEmployeeOnboardingFeatureRequest {
  string id             = 1;
  string step_id        = 2;
  string feature_name   = 3;
  string feature_type   = 4;
  bool   has_options    = 5;
  string options        = 6; // JSON string if applicable
}

message DeleteEmployeeOnboardingFeatureRequest {
  string id = 1;
}

message ListEmployeeOnboardingFeaturesRequest {
  string step_id = 1;
}

// -----------------------------
// Responses
// -----------------------------
message EmployeeOnboardingFeature {
  string id             = 1;
  string step_id        = 2;
  string feature_name   = 3;
  string feature_type   = 4;
  bool   has_options    = 5;
  string options        = 6;
}

message EmployeeOnboardingFeatureResponse {
  EmployeeOnboardingFeature feature = 1;
  string message = 2;
  bool success = 3;
}

message ListEmployeeOnboardingFeaturesResponse {
  repeated EmployeeOnboardingFeature features = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
  string message = 6;
  bool success = 7;
}

message DeleteEmployeeOnboardingFeatureResponse {
  bool success = 1;
  string message = 2;
}
