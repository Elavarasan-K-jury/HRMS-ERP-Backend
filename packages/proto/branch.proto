syntax = "proto3";

package branch;

service BranchService {
  rpc CreateBranch(CreateBranchRequest) returns (BranchResponse);
  rpc GetBranch(GetBranchRequest) returns (BranchResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc UpdateBranch(UpdateBranchRequest) returns (BranchResponse);
  rpc DeleteBranch(DeleteBranchRequest) returns (DeleteBranchResponse);
}

message Branch {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string code = 4;
  string description = 5;
  bool is_active = 6;
  string created_at = 7;
  string updated_at = 8;
  string deleted_at = 9;
}

message CreateBranchRequest {
  string organization_id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
}

message GetBranchRequest { string id = 1; }

message ListBranchesRequest {
  string organization_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string search = 4;
  string sort_by = 5;
  string sort_order = 6;
}

message UpdateBranchRequest {
  string id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  bool is_active = 5;
}

message DeleteBranchRequest { string id = 1; }

message BranchResponse {
  Branch branch = 1;
  bool success = 2;
  string message = 3;
}

message ListBranchesResponse {
  repeated Branch branches = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
  bool success = 6;
  string message = 7;
}

message DeleteBranchResponse {
  bool success = 1;
  string message = 2;
}
