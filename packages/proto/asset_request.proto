syntax = "proto3";

package asset_request;

// -----------------------------
// Service
// -----------------------------
service AssetRequestService {
  rpc CreateAssetRequest (CreateAssetRequest) returns (AssetRequestResponse);
  rpc GetAssetRequest    (GetAssetRequest)    returns (AssetRequestResponse);
  rpc ListAssetRequests  (ListAssetRequestsRequest) returns (ListAssetRequestsResponse);
  rpc UpdateAssetRequest (UpdateAssetRequest) returns (AssetRequestResponse);
  rpc DeleteAssetRequest (DeleteAssetRequest) returns (DeleteAssetRequestResponse);
}

// -----------------------------
// Requests
// -----------------------------

// Create
message CreateAssetRequest {
  string organization_id = 1;
  string category_id     = 2;
  string model_id        = 3;
  string employee_id     = 4;
  string reason          = 5;
  int32  quantity        = 6;
  string priority        = 7;
  string status          = 8;
  string approved_by     = 9;  // optional
  string approved_at     = 10; // optional: ISO string
  string rejection_reason = 11; // optional
}

// Get
message GetAssetRequest {
  string id = 1;
}

// Update
message UpdateAssetRequest {
  string id              = 1;
  string organization_id = 2;
  string category_id     = 3;
  string model_id        = 4;
  string employee_id     = 5;
  string reason          = 6;
  int32  quantity        = 7;
  string priority        = 8;
  string status          = 9;
  string approved_by     = 10;
  string approved_at     = 11;
  string rejection_reason = 12;
}

// Delete
message DeleteAssetRequest {
  string id = 1;
}

// List
message ListAssetRequestsRequest {
  string organization_id = 1;
  string employee_id     = 2;
  string status          = 3; // optional filter
}

// -----------------------------
// Responses
// -----------------------------

message AssetRequest {
  string id              = 1;
  string organization_id = 2;
  string category_id     = 3;
  string model_id        = 4;
  string employee_id     = 5;
  string approved_by     = 6;
  string reason          = 7;
  int32  quantity        = 8;
  string priority        = 9;
  string status          = 10;
  string approved_at     = 11;
  string rejection_reason = 12;
  string created_at      = 13;
  string updated_at      = 14;
  string deleted_at      = 15;
}

message AssetRequestResponse {
  AssetRequest request = 1;
}

message ListAssetRequestsResponse {
  repeated AssetRequest requests = 1;
}

message DeleteAssetRequestResponse {
  bool success = 1;
  string message = 2;
}
