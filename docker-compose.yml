services:
  mongodb:
    image: mongo:7
    container_name: juryhrms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123

  redis:
    image: redis:7-alpine
    container_name: juryhrms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  gateway:
    build: .
    container_name: juryhrms-gateway
    restart: unless-stopped
    ports:
      - "50050:50050"
    environment:
      - NPM_COMMAND=npm run start:gateway
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - FILE_STORAGE=${FILE_STORAGE}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - ALLOWED_IPS=${ALLOWED_IPS}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX}
      - REQUEST_QUEUE_LIMIT=${REQUEST_QUEUE_LIMIT}
      - CRON_FAST_MODE=${CRON_FAST_MODE}
    depends_on:
      - mongodb
      - redis

  admin:
    build: .
    container_name: juryhrms-admin
    restart: unless-stopped
    environment:
      - NPM_COMMAND=npm run start:admin
